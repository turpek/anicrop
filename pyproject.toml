[build-system]
requires = ["setuptools>=61.0", "cython>=3.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "anicrop"
version = "0.4.0"
description = "A Python engine for non-destructive 2D image composition and editing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "imagesize>=2.0.1",
    "numpy>=2.4.2",
    "opencv-python>=4.13.0.92",
    "ovld>=0.5.14",
    "pyvips>=2.2.3",
]

[dependency-groups]
dev = [
    "autopep8>=2.3.2",
    "cython>=3.2.9",
    "ipdb>=0.13.13",
    "ipython>=9.9.0",
    "matplotlib>=3.10.8",
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.9.0",
    "setuptools>=61.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "slow: marca testes pesados ou demorados com MMap/LOD (desselecione com '-m \"not slow\"')",
]

[tool.ruff]
line-length = 89
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
extend-select = ["PLC0415"]
ignore = ["E501", "E741"]

[tool.autopep8]
max_line_length = 89
ignore = ["E501", "E402", "W503", "W504"]
in_place = true
recursive = true
