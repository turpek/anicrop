[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anicrop"
version = "0.1.0"
description = "Programa para fazer stitch de animes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numcodecs>=0.16.5",
    "numpy>=2.4.2",
    "opencv-python>=4.13.0.92",
    "ovld>=0.5.14",
    "zarr>=3.2.1",
]

[dependency-groups]
dev = [
    "autopep8>=2.3.2",
    "ipdb>=0.13.13",
    "ipython>=9.9.0",
    "matplotlib>=3.10.8",
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
